name: Sync WordPress content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [wordpress-published]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: wordpress-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate WordPress configuration
        run: |
          if [[ ! "$WORDPRESS_URL" =~ ^https:// ]]; then
            echo "Repository variable WORDPRESS_URL must contain the HTTPS URL of the WordPress CMS." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install -r requirements.txt

      - name: Import published posts and build the static site
        run: |
          python -m unittest discover -s tests -v
          python scripts/import_wordpress.py
          python build.py

      - name: Commit refreshed static content
        run: |
          git config user.name "hkbrezno-content-bot"
          git config user.email "content-bot@hkbrezno.sk"
          git add content/wordpress public/images/articles/wordpress public/documents/wordpress
          git add images/articles/wordpress documents/wordpress aktuality index.html site.js sitemap.xml
          if git diff --cached --quiet; then
            echo "WordPress content is already current."
          else
            git commit -m "content: sync WordPress articles"
            git push
          fi
